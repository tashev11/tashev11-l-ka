name: Сообщить об ошибке
description: Сообщите о проблеме в L-KA
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Спасибо за сообщение. Не публикуйте здесь пароли, токены, приватную переписку и другие персональные данные.
        Если проблема связана с безопасностью, используйте SECURITY.md вместо публичного Issue.
  - type: dropdown
    id: platform
    attributes:
      label: Платформа
      options:
        - Web
        - Android
        - Windows
        - macOS
        - iPhone / iPad (PWA)
        - Бизнес-чат / виджет
        - Другое
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Версия ОС / браузера
      placeholder: "Например: Windows 11 / Chrome 151"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Как воспроизвести
      description: Опишите действия по шагам.
      placeholder: "1. Открыл...\n2. Нажал...\n3. Произошло..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Что ожидалось
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Что произошло
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Дополнительная информация
      description: Скриншоты и детали можно приложить, только если они не содержат приватных данных.
  - type: checkboxes
    id: privacy
    attributes:
      label: Проверка приватности
      options:
        - label: Я убедился, что не публикую пароль, токен, приватную переписку или персональные данные.
          required: true
